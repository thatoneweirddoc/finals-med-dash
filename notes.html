<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finals Notes">
<meta name="theme-color" content="#F4F3F8">
<title>Notes — Finals Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==== inlined verbatim from index.html at build time — do not edit here ====
   Regenerate with: python3 tools/build_notes_page.py                      */
  /* ============================================================
     Finals Panel — restyle only. Same markup, same IDs, same JS.
     Urbanist + IBM Plex Mono. Light by default; dark follows the
     system setting on the same palette.
     ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap');

  :root{
    --ink:#352B38;
    --ink-2:#7E808C;
    --ink-3:#6C6D7A;
    --paper:#F4F3F8;
    --panel:#FFFFFF;
    --panel-2:#F7F6FB;
    --rule:#E8E6F1;
    --rule-2:#F0EEF6;
    --lav:#DAD8F9;

    /* flag hues — fixed meaning: red < amber < green, grey = never tested */
    --low:#BF4340;
    --border-flag:#A87B2B;
    --inrange:#2F7A62;
    --untested:#78798A;
    --low-wash:#FAEBEA;
    --bord-wash:#FAF3E5;
    --in-wash:#E9F3EF;

    /* aliases the quiz player styles came in with */
    --in:#2F7A62;
    --un:#78798A;
    --bord:#A87B2B;

    /* card tints, cycled across the stat row */
    --tint-1:#DAD8F9;
    --tint-2:#DCE8F7;
    --tint-3:#F3E2EF;
    --tint-4:#ECEBF4;

    --stat-border:transparent;
    --onink-rule:rgba(255,255,255,.14);
    --band-op:.22;
    --shadow:0 1px 2px rgba(53,43,56,.04), 0 12px 30px -20px rgba(53,43,56,.28);
    --shadow-lift:0 1px 2px rgba(53,43,56,.05), 0 20px 42px -22px rgba(53,43,56,.40);

    --r-card:20px;
    --r-ctl:13px;

    --sans:'Urbanist',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'Urbanist',system-ui,sans-serif;
  }

  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#EDEBF4;
      --ink-2:#9E9FAE;
      --ink-3:#9B9CAB;
      --paper:#17141B;
      --panel:#211D26;
      --panel-2:#282331;
      --rule:#332D3B;
      --rule-2:#2A2532;
      --lav:#4A4570;

      --low:#EE7C72;
      --border-flag:#D5A24C;
      --inrange:#5CBD97;
      --untested:#9B9CAB;
      --low-wash:#37211F;
      --bord-wash:#332916;
      --in-wash:#19302A;

      --in:#5CBD97;
      --un:#9B9CAB;
      --bord:#D5A24C;

      --tint-1:#2B2740;
      --tint-2:#212B39;
      --tint-3:#332435;
      --tint-4:#282331;

      --stat-border:#332D3B;
      --onink-rule:rgba(0,0,0,.16);
      --band-op:.34;
      --shadow:0 1px 2px rgba(0,0,0,.30), 0 12px 30px -20px rgba(0,0,0,.75);
      --shadow-lift:0 1px 2px rgba(0,0,0,.35), 0 22px 42px -22px rgba(0,0,0,.85);
    }
  }

  :root[data-theme="dark"]{
    --ink:#EDEBF4;
    --ink-2:#9E9FAE;
    --ink-3:#9B9CAB;
    --paper:#17141B;
    --panel:#211D26;
    --panel-2:#282331;
    --rule:#332D3B;
    --rule-2:#2A2532;
    --lav:#4A4570;

    --low:#EE7C72;
    --border-flag:#D5A24C;
    --inrange:#5CBD97;
    --untested:#9B9CAB;
    --low-wash:#37211F;
    --bord-wash:#332916;
    --in-wash:#19302A;

    --in:#5CBD97;
    --un:#9B9CAB;
    --bord:#D5A24C;

    --tint-1:#2B2740;
    --tint-2:#212B39;
    --tint-3:#332435;
    --tint-4:#282331;

    --stat-border:#332D3B;
    --onink-rule:rgba(0,0,0,.16);
    --band-op:.34;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 12px 30px -20px rgba(0,0,0,.75);
    --shadow-lift:0 1px 2px rgba(0,0,0,.35), 0 22px 42px -22px rgba(0,0,0,.85);
  }

  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
       -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  .wrap{max-width:960px;margin:0 auto;
        padding:0 calc(18px + env(safe-area-inset-left)) calc(76px + env(safe-area-inset-bottom))
                  calc(18px + env(safe-area-inset-right))}
  a{color:var(--ink)}
  a:hover{color:var(--ink-2)}

  /* ---- masthead ---- */
  header{border-bottom:0;padding:calc(24px + env(safe-area-inset-top)) 0 6px;margin-bottom:0}
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
  h1{font-family:var(--sans);font-weight:600;font-size:34px;letter-spacing:-.025em;margin:0;line-height:1.05}
  .sub{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
       color:var(--ink-3);margin-top:7px}
  .countdown{flex-shrink:0;text-align:right;font-family:var(--sans);
    background:var(--lav);border:1px solid transparent;border-radius:16px;
    padding:11px 18px 12px;box-shadow:var(--shadow)}
  .countdown .n{font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.04em;display:block;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .countdown .l{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink);opacity:.6}

  .sync{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--untested);margin-top:14px;display:inline-flex;align-items:center;gap:7px}
  .sync::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .sync.ok{color:var(--inrange)} .sync.warn{color:var(--border-flag)}

  /* ---- tabs: a soft segmented rail ---- */
  nav{display:flex;gap:4px;border-bottom:0;margin:16px 0 22px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
      background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:5px;
      box-shadow:var(--shadow)}
  nav::-webkit-scrollbar{display:none}
  nav button{appearance:none;background:none;border:0;border-radius:12px;
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em;
    color:var(--ink-2);padding:0 17px;min-height:44px;cursor:pointer;white-space:nowrap;margin-bottom:0;
    transition:background .15s,color .15s}
  nav button:hover{color:var(--ink);background:var(--panel-2)}
  nav button[aria-selected="true"]{color:var(--paper);background:var(--ink);border-bottom-color:transparent}
  nav button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

  /* ---- signature: reference-range bars ---- */
  .assay{border-bottom:1px solid var(--rule-2);padding:15px 0;display:grid;
         grid-template-columns:1fr 142px 62px;gap:14px;align-items:center}
  .assay:last-child{border-bottom:0}
  .assay-name{font-weight:500;letter-spacing:-.005em}
  .pri-badge{display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:9px;font-weight:600;margin-right:8px;
    position:relative;top:-1px}
  .assay-meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}

  .range{position:relative;height:24px}
  .range-track{position:absolute;top:9px;left:0;right:0;height:6px;background:var(--rule);border-radius:999px}
  .range-band{position:absolute;top:9px;height:6px;background:var(--inrange);opacity:var(--band-op);
              left:60%;right:0;border-radius:999px}
  .tick{position:absolute;top:2px;width:3px;height:20px;background:var(--ink);border-radius:999px;
        box-shadow:0 0 0 2.5px var(--panel)}
  .flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
        text-align:right;font-weight:600}
  .f-low{color:var(--low)} .f-bord{color:var(--border-flag)}
  .f-in{color:var(--inrange)} .f-un{color:var(--untested)}

  /* quiz bank performance bars — the red ground showing through IS the miss */
  .qbar{height:10px;background:var(--low);margin-top:12px;border-radius:999px;overflow:hidden}
  .qbar-fill{height:10px;background:var(--in);border-radius:999px;transition:width .3s}
  .qbar-meta{display:flex;justify-content:space-between;font-family:var(--mono);
             font-size:10px;letter-spacing:.04em;color:var(--ink-3);margin-top:6px}
  .qbar-none{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--un);margin-top:12px}

  /* ---- quiz player ---- */
  .prog-track{height:6px;background:var(--rule);border-radius:999px;position:relative;margin-top:4px}
  .prog-fill{height:6px;background:var(--ink);border-radius:999px;transition:width .2s}
  .prog-text{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:8px;
             display:flex;justify-content:space-between}
  .qcard .q-n{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);
       margin-bottom:10px;display:flex;justify-content:space-between}
  .q-stem{font-size:17px;line-height:1.5;margin-bottom:16px}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;
       border:1px solid var(--rule);background:var(--panel);
       margin-bottom:9px;cursor:pointer;border-radius:var(--r-ctl);min-height:52px;
       transition:border-color .14s,background .14s}
  .opt:hover{border-color:var(--ink-2)}
  .opt input[type=radio]{margin-top:2px;width:20px;height:20px;accent-color:var(--ink);flex-shrink:0}
  .opt.sel{border-color:var(--ink);background:var(--lav)}
  .opt.correct{border-color:var(--in);background:var(--in-wash)}
  .opt.wrong{border-color:var(--low);background:var(--low-wash)}
  .opt-label{font-size:16px;line-height:1.45}
  .mark{font-family:var(--mono);font-size:11px;font-weight:600;margin-left:auto;flex-shrink:0}
  .mark.correct{color:var(--in)} .mark.wrong{color:var(--low)}
  .expl{display:none;margin-top:14px;padding:15px 17px;background:var(--panel-2);
        border-left:3px solid var(--ink);border-radius:0 var(--r-ctl) var(--r-ctl) 0;
        font-size:15px;line-height:1.6;color:var(--ink-2)}
  .expl b{color:var(--ink)}
  .qcard.done .expl{display:block}

  .results{background:var(--ink);color:var(--paper);padding:26px;margin:18px 0;
    border-radius:var(--r-card);box-shadow:var(--shadow-lift)}
  .results .score{font-family:var(--sans);font-size:52px;font-weight:600;line-height:1;
    letter-spacing:-.04em}
  .results .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
                opacity:.6;margin-top:6px;color:inherit}
  .breakdown{margin-top:18px;font-size:14px}
  .breakdown div{display:flex;justify-content:space-between;padding:7px 0;
                 border-bottom:1px solid var(--onink-rule)}

  /* ---- summary ---- */
  .summary{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-card);
    padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
  .summary h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 12px;font-weight:600}
  .summary p{font-family:var(--sans);font-size:18px;font-weight:400;line-height:1.5;margin:0 0 18px;
    letter-spacing:-.01em;text-wrap:pretty}
  .summary .lists{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .summary .lists h4{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    margin:0 0 8px;font-weight:600}
  .summary .lists h4.s{color:var(--in)} .summary .lists h4.w{color:var(--low)}
  .summary .lists ul{margin:0;padding-left:16px;font-size:14.5px;line-height:1.55}
  .summary .lists li{margin-bottom:5px}
  .summary .lists .none{font-family:var(--mono);font-size:11px;color:var(--un)}
  @media (max-width:520px){.summary .lists{grid-template-columns:1fr;gap:14px}}

  /* ---- the one thing to do next ---- */
  .top-pri{background:var(--ink);color:var(--paper);padding:19px 22px;margin-bottom:14px;
           border-radius:var(--r-card);display:flex;flex-direction:column;gap:3px;
           box-shadow:var(--shadow-lift)}
  .top-pri .tp-label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.6}
  .top-pri .tp-name{font-family:var(--sans);font-size:23px;font-weight:600;line-height:1.2;
    letter-spacing:-.02em}
  .top-pri .tp-why{font-family:var(--mono);font-size:11px;opacity:.75}

  /* ---- topic include / exclude ---- */
  .excl-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--ink-3);margin:18px 0 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  /* select-all control that sits in the header, outside the grid */
  .sel-all{margin-left:auto;display:flex;align-items:center;gap:9px;cursor:pointer;
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
    color:var(--ink);min-height:44px;padding-left:12px}
  .sel-all:hover{color:var(--ink-2)}
  .sel-all input[type=checkbox]{width:20px;height:20px;border-radius:6px}
  .sel-all input[type=checkbox]:indeterminate{background:var(--ink);border-color:var(--ink)}
  .sel-all input[type=checkbox]:indeterminate::after{
    content:'';position:absolute;left:4px;top:8px;width:10px;height:2px;
    background:var(--paper);border:0;transform:none}
  #exclAllBox:checked,#exclAllBox:indeterminate{background:var(--low);border-color:var(--low)}
  #exclAllBox:checked::after{border-color:#fff}
  #exclAllBox:indeterminate::after{background:#fff;border-color:#fff}
  .excl-count{color:var(--ink);font-weight:600}
  .excl-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;
             max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;
             border:1px solid var(--rule);border-radius:var(--r-ctl);
             background:var(--panel-2);padding:8px 14px}
  .excl-row{display:flex;align-items:center;gap:12px;padding:0;font-size:15px;min-height:44px}
  .excl-row label{cursor:pointer;flex:1;padding:12px 0;line-height:1.35}
  @media (max-width:480px){.excl-grid{grid-template-columns:1fr}}

  /* ---- panels & type ---- */
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-card);
    padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
  .panel-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--rule-2)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;
         background:none;border:0;margin-bottom:14px}
  .stat{background:var(--tint-1);border-radius:18px;padding:18px 20px 20px;
        border:1px solid var(--stat-border)}
  .stat:nth-child(4n+2){background:var(--tint-2)}
  .stat:nth-child(4n+3){background:var(--tint-3)}
  .stat:nth-child(4n+4){background:var(--tint-4)}
  .stat .n{font-family:var(--sans);font-size:40px;font-weight:600;letter-spacing:-.045em;
    display:block;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
           color:var(--ink);opacity:.72;margin-top:9px}

  /* ---- list rows ---- */
  .item{border-bottom:1px solid var(--rule-2);padding:14px 0}
  .item:last-child{border-bottom:0}
  .item-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .item-t{font-weight:600;letter-spacing:-.01em}
  .sys{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .item-d{font-size:15px;color:var(--ink-2);margin-top:5px}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
       border:1px solid var(--rule);border-radius:999px;padding:4px 11px;color:var(--ink-2);white-space:nowrap}
  .tag.recall{border-color:var(--low);color:var(--low);background:var(--low-wash)}
  .tag.disc{border-color:var(--border-flag);color:var(--border-flag);background:var(--bord-wash)}
  .tag.app{border-color:var(--rule);color:var(--ink-2);background:var(--panel-2)}
  .attempts{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  .note{font-size:14px;color:var(--ink-2);font-style:normal;font-family:var(--sans);
        border-left:2px solid var(--rule);padding-left:14px;margin:16px 0 0;text-wrap:pretty}
  select.narrow{width:auto;min-width:0;flex:0 0 auto}
  .fold{border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--panel);
    padding:12px 16px;margin-bottom:18px}
  .fold>summary{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-2);cursor:pointer;list-style:none}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary::before{content:'+ ';font-weight:700}
  .fold[open]>summary::before{content:'\2212 '}
  .pts{margin:9px 0 0;padding-left:17px}
  .pts li{font-size:14px;line-height:1.45;color:var(--ink);margin-bottom:5px}
  .pts li .chose{color:var(--ink-2);font-size:13px}
  .pts-none{font-family:var(--mono);font-size:11px;color:var(--untested);margin-top:8px}
  .diff{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 6px;border-radius:3px;margin-left:7px;font-weight:700}
  .diff-easy{background:rgba(90,160,110,.16);color:#4b8a5f}
  .diff-medium{background:rgba(190,150,70,.16);color:#9a7a34}
  .diff-hard{background:rgba(190,90,90,.16);color:#a35555}
  .empty{font-family:var(--mono);font-size:12px;color:var(--untested);padding:30px 0;text-align:center}
  [hidden]{display:none !important}

  /* ---- controls ---- */
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
  input:not([type=checkbox]):not([type=radio]),select,textarea{
    font-family:var(--sans);font-size:16px;padding:12px 15px;min-height:44px;
    border:1px solid var(--rule);background:var(--panel-2);color:var(--ink);
    border-radius:var(--r-ctl);-webkit-appearance:none;appearance:none}
  /* inline font-size attrs on the paste boxes would trip iOS zoom — override them */
  textarea,#pasteIn,#sessText,#quizPaste,#mdOut{font-size:16px !important;line-height:1.5;resize:vertical}
  select{padding-right:38px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
                     linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
    background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;
    background:var(--panel)}
  input.grow{flex:1;min-width:170px}

  /* checkboxes: drawn rather than native, so the tick renders the same everywhere */
  input[type=checkbox]{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;flex-shrink:0;margin:0;
    border:1.5px solid var(--ink-3);background:var(--panel);
    border-radius:7px;cursor:pointer;position:relative;transition:background .12s,border-color .12s}
  /* the drawn box is 22px; this extends its hit area to 44px without moving it */
  input[type=checkbox]::before{content:'';position:absolute;left:-11px;top:-11px;width:44px;height:44px}
  input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
  input[type=checkbox]:checked::after{
    content:'';position:absolute;left:7px;top:3px;
    width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;
    transform:rotate(45deg)}
  input[type=checkbox]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* excluded list reads as removal, so its ticks are red rather than ink */
  #exclGrid input[type=checkbox]:checked{background:var(--low);border-color:var(--low)}
  #exclGrid input[type=checkbox]:checked::after{border-color:#fff}

  button.act{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0;

/* theme — same key as the dashboard, so the setting carries across pages */
(function(){
  var KEY_T='finals_theme', root=document.documentElement,
      btns=document.querySelectorAll('[data-theme-set]'),
      meta=document.querySelector('meta[name=theme-color]');
  function apply(m){
    if(m==='auto'){ delete root.dataset.theme; } else { root.dataset.theme=m; }
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.themeSet===m)); });
    if(meta) requestAnimationFrame(function(){
      meta.content=getComputedStyle(root).getPropertyValue('--paper').trim()||'#F4F3F8'; });
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){
    try{ localStorage.setItem(KEY_T,b.dataset.themeSet); }catch(e){} apply(b.dataset.themeSet); }); });
  var s='auto'; try{ s=localStorage.getItem(KEY_T)||'auto'; }catch(e){}
  apply(s);
})();
</script>

  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- tokeniser: must mirror tokenize() in tools/build_notes.py ---- */
const STOP = new Set(('a an and are as at be but by for if in into is it its of on or such that the '+
'their then there these they this to was were will with from he she his her you your we our '+
'not no nor do does did done has have had having been being can could should would may might '+
'must about above after again against all also am any because before below between both each '+
'few further here how i me more most other over own same so some than too under until up very '+
'what when where which while who whom why').split(' '));
const tokenize = t => (String(t).toLowerCase().match(/[a-z0-9]+/g)||[])
  .filter(x => x.length>=2 && !STOP.has(x));
const slugify = s => String(s).toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/[\s_]+/g,'-')||'section';

/* ---------------------------------------------------------------- load */
async function boot(){
  try{
    const [idx, sr, syn] = await Promise.all([
      getJSON(NOTES_BASE+'index.json'),
      getJSON(NOTES_BASE+'search-index.json'),
      getJSON(NOTES_BASE+'synonyms.json').catch(() => ({groups:[]}))
    ]);
    IDX=idx; SEARCH=sr; SYN=syn;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({idx,sr,syn,at:Date.now()})); }catch(e){}
  }catch(err){
    let c=null; try{ c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    if(!c){ return fatal(err); }
    IDX=c.idx; SEARCH=c.sr; SYN=c.syn;
  }
  buildSynMap();
  TOKENS = Object.keys(SEARCH.postings).sort();
  readTracker();
  renderHead(); renderChips(); renderTree();
  route();
  if(!TRACKER) refreshTracker();
}

async function getJSON(u){
  const r = await fetch(u + '?t=' + Date.now());
  if(!r.ok) throw new Error(u+' → '+r.status);
  return r.json();
}

function fatal(err){
  $('pane').innerHTML = `<div class="empty"><h3>Couldn't load the library</h3>
    <p>${esc(err.message||err)}. If you're offline and haven't opened this page before,
    there's nothing cached yet — reconnect once and it'll work offline after that.</p></div>`;
  $('tree').innerHTML = '<div class="tempty">Unavailable</div>';
}

function buildSynMap(){
  SYNMAP = new Map();
  (SYN.groups||[]).forEach(g => g.forEach(t => {
    if(!SYNMAP.has(t)) SYNMAP.set(t, new Set());
    g.forEach(o => SYNMAP.get(t).add(o));
  }));
}

function readTracker(){
  try{ TRACKER = JSON.parse(localStorage.getItem(TRACKER_KEY)||'null'); }catch(e){ TRACKER=null; }
}

/* If the dashboard hasn't been opened on this device yet there's no cached tracker,
   but the sync token may still be stored. Pull once, quietly, and re-render if it lands.
   Read-only: this page never writes to the tracker. */
async function refreshTracker(){
  let t=''; try{ t = localStorage.getItem('finals_token')||''; }catch(e){}
  if(!t) return;
  try{
    const r = await fetch(SYNC_URL + '?token=' + encodeURIComponent(t));
    const j = await r.json();
    if(j && j.topics){
      TRACKER = j;
      try{ localStorage.setItem(TRACKER_KEY, JSON.stringify(j)); }catch(e){}
      route();
    }
  }catch(e){ /* offline or bad token — the cached copy is good enough */ }
}

function renderHead(){
  const c = IDX.counts||{};
  $('libN').textContent = c.sections||0;
  $('libSub').textContent = `${c.notes||0} notes · ${c.systems||0} systems · ` +
    `${(c.words||0).toLocaleString()} words · built ${IDX.generated||'—'}`;
}

/* ---------------------------------------------------------- system chips */
function renderChips(){
  $('chips').innerHTML = (IDX.systems||[]).map(s =>
    `<button class="chip" type="button" data-sys="${esc(s.system)}" aria-pressed="false">
       ${esc(s.system)} <span style="opacity:.55">${s.notes.length}</span></button>`).join('');
  $('chips').querySelectorAll('[data-sys]').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.sys;
    if(activeSystems.has(s)) activeSystems.delete(s); else activeSystems.add(s);
    b.setAttribute('aria-pressed', String(activeSystems.has(s)));
    renderTree();
    if($('q').value.trim()) doSearch();
  }));
}
const sysAllowed = s => activeSystems.size===0 || activeSystems.has(s);

/* ----------------------------------------------------------------- tree */
function renderTree(){
  const sys = (IDX.systems||[]).filter(s => sysAllowed(s.system));
  if(!sys.length){ $('tree').innerHTML='<div class="tempty">No systems match that filter.</div>'; return; }
  $('tree').innerHTML = sys.map(s => {
    const open = activePath && s.notes.some(n => n.path===activePath);
    return `<div class="tsys" data-open="${open?1:0}">
      <button type="button"><span class="caret">&#9654;</span>${esc(s.system)}
        <span class="cnt">${s.notes.length}</span></button>
      <ul>${s.notes.map(n => `<li><a href="#/${encodeURI(n.path)}"
        aria-current="${n.path===activePath}">${esc(n.title)}</a></li>`).join('')}</ul>
    </div>`;
  }).join('');
  $('tree').querySelectorAll('.tsys>button').forEach(b => b.addEventListener('click', () => {
    const p=b.parentElement; p.dataset.open = p.dataset.open==='1' ? '0' : '1';
  }));
}

/* --------------------------------------------------------------- search */
function expand(term){
  const out = new Set([term]);
  if(SYNMAP.has(term)) SYNMAP.get(term).forEach(t => out.add(t));
  if(term.length>=3){
    let lo=0, hi=TOKENS.length;
    while(lo<hi){ const mid=(lo+hi)>>1; if(TOKENS[mid]<term) lo=mid+1; else hi=mid; }
    for(let i=lo; i<TOKENS.length && TOKENS[i].startsWith(term); i++) out.add(TOKENS[i]);
  }
  return [...out];
}

function search(q){
  const terms = tokenize(q);
  if(!terms.length) return [];
  const N = SEARCH.docs.length;
  const perTerm = terms.map(t => {
    const hits = new Map();
    expand(t).forEach(v => {
      const post = SEARCH.postings[v];
      if(!post) return;
      const idf = Math.log(1 + N/post.length);
      const exact = (v===t) ? 1 : 0.62;                 // synonym/prefix matches score lower
      post.forEach(([di,tf]) => hits.set(di, (hits.get(di)||0) + tf*idf*exact));
    });
    return hits;
  });
  const all = perTerm.reduce((acc,h) => { h.forEach((v,k) => acc.add(k)); return acc; }, new Set());
  const scored = [];
  all.forEach(di => {
    const d = SEARCH.docs[di];
    if(!sysAllowed(d.sys)) return;
    let score=0, matched=0;
    perTerm.forEach(h => { if(h.has(di)){ score += h.get(di); matched++; } });
    if(matched < terms.length) score *= Math.pow(0.35, terms.length-matched);  // AND-ish
    if(d.lvl<=2) score *= 1.12;
    scored.push({di, d, score, matched});
  });
  scored.sort((a,b) => b.score-a.score || a.di-b.di);
  return scored.slice(0,80);
}

function snippet(text, terms){
  const low = text.toLowerCase();
  let at = -1;
  for(const t of terms){ const i = low.indexOf(t); if(i>-1 && (at<0 || i<at)) at=i; }
  if(at<0) at=0;
  let start = Math.max(0, at-110), end = Math.min(text.length, at+230);
  if(start>0){ const sp=text.indexOf(' ',start); if(sp>-1 && sp<start+25) start=sp+1; }
  let out = text.slice(start,end).replace(/\s*\n+\s*/g,' ').replace(/[|#>*`]/g,'').trim();
  out = esc(out);
  // only highlight from a word boundary — otherwise the abbreviation map lights up
  // fragments mid-word (ARR inside "carries"), which reads as a wrong match
  const alts = terms.filter(t=>t.length>1)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
    .sort((a,b)=>b.length-a.length);
  if(alts.length){
    const re = new RegExp('(^|[^\\p{L}\\p{N}])('+alts.join('|')+')(\\p{L}*)','giu');
    out = out.replace(re, (m,pre,word,tail) =>
      pre + '<span class="hl">' + word + '</span>' + tail);
  }
  return (start>0?'…':'') + out + (end<text.length?'…':'');
}

function doSearch(){
  const q = $('q').value.trim();
  $('sfield').classList.toggle('has-q', !!q);
  if(!q){ activePath ? openNote(activePath) : landing(); return; }
  const res = search(q);
  const terms = [...new Set(tokenize(q).flatMap(expand))];
  if(!res.length){
    $('pane').innerHTML = `<div class="empty"><h3>Nothing for “${esc(q)}”</h3>
      <p>Try a shorter stem — searching <b>adren</b> matches adrenal and adrenaline.
      Abbreviations expand too, so <b>MI</b> finds myocardial infarction.</p></div>`;
    return;
  }
  const groups = new Map();
  res.forEach(r => {
    if(!groups.has(r.d.path)) groups.set(r.d.path, {d:r.d, hits:[], score:0});
    const g = groups.get(r.d.path);
    if(g.hits.length<4) g.hits.push(r);
    g.score = Math.max(g.score, r.score);
  });
  const ordered = [...groups.values()].sort((a,b) => b.score-a.score);
  const nSec = res.length;
  $('pane').innerHTML =
    `<div class="rmeta">${nSec} section${nSec===1?'':'s'} in ${ordered.length} note${ordered.length===1?'':'s'}</div>` +
    ordered.map(g => `<div class="rgroup">
      <h3>${esc(g.d.title)}</h3>
      <div class="rsys">${esc(g.d.sys)}</div>
      ${g.hits.map(h => {
        const path = [h.d.parent, h.d.h].filter(Boolean).join(' › ') || 'Opening section';
        return `<a class="rhit" href="#/${encodeURI(h.d.path)}::${encodeURIComponent(h.d.hid)}">
          <div class="rpath">${esc(path)}</div>
          <div class="rsnip">${snippet(h.d.text, terms)}</div></a>`;
      }).join('')}
    </div>`).join('');
}

/* ------------------------------------------------------------- markdown */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
}

function mdToHtml(src){
  const lines = src.split('\n');
  const out = []; const seen = {};
  let i=0, para=[], list=null;

  const flushP = () => { if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushL = () => { if(list){ out.push(`</${list}>`); list=null; } };
  const hid = txt => { const b=slugify(txt); seen[b]=(seen[b]||0)+1;
    return seen[b]===1 ? b : b+'-'+seen[b]; };

  while(i<lines.length){
    const line = lines[i];

    if(/^```/.test(line)){                                        // fenced code
      flushP(); flushL(); i++;
      const buf=[];
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    const h = line.match(/^(#{2,6})\s+(.*)$/);
    if(h){                                                        // headings
      flushP(); flushL();
      // demote by one: the note title is the h2, so ## becomes h3 and nests correctly
      const lvl = Math.min(6, h[1].length + 1), txt = h[2].trim();
      out.push(`<h${lvl} id="${esc(hid(txt))}">${inline(txt)}</h${lvl}>`);
      i++; continue;
    }
    if(/^(---|\*\*\*)\s*$/.test(line)){ flushP(); flushL(); out.push('<hr>'); i++; continue; }

    if(/^\s*\|/.test(line) && /^\s*\|?[\s:-]*-[\s|:-]*$/.test(lines[i+1]||'')){   // table
      flushP(); flushL();
      const row = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
      const head = row(line); i+=2;
      const body=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])) body.push(row(lines[i++]));
      const anyHead = head.some(c => c!=='');
      // data-label carries the column heading so narrow screens can stack each row as
      // a labelled card instead of forcing a sideways scroll through a 4-column table —
      // which is what made the dense pharmacology tables unreadable on a phone.
      const lbl = i => (anyHead && head[i] ? esc(head[i].replace(/\*\*/g,'')) : '');
      out.push('<table'+(head.length>2?' class="wide"':'')+'>'+
        (anyHead ? '<thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead>':'')+
        '<tbody>'+body.map(r=>'<tr>'+r.map((c,ci)=>`<td data-label="${lbl(ci)}">${inline(c)}</td>`).join('')+'</tr>').join('')+
        '</tbody></table>');
      continue;
    }
    if(/^>\s?/.test(line)){                                       // blockquote / callout
      flushP(); flushL();
      const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      let body = buf.join(' ').trim();
      const cm = body.match(/^\[!(\w+)\]\s*(.*)$/s);
      if(cm){
        const kind = cm[1].toLowerCase();
        const cls = kind==='verify' ? 'cl-verify' : 'cl-key';
        const label = kind==='verify' ? 'Verify before relying on this' : 'Key rule';
        out.push(`<div class="callout ${cls}"><span class="cl-l">${label}</span><p>${inline(cm[2])}</p></div>`);
      } else {
        out.push(`<blockquote><p>${inline(body)}</p></blockquote>`);
      }
      continue;
    }
    const li = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if(li){                                                       // lists
      flushP();
      const want = /^\d/.test(li[1]) ? 'ol' : 'ul';
      if(list!==want){ flushL(); out.push(`<${want}>`); list=want; }
      let txt = li[2];
      while(/^\s{2,}\S/.test(lines[i+1]||'') && !/^\s*([-*]|\d+\.)\s/.test(lines[i+1])){
        txt += ' ' + lines[++i].trim();
      }
      out.push('<li>'+inline(txt)+'</li>');
      i++; continue;
    }
    if(!line.trim()){ flushP(); flushL(); i++; continue; }
    para.push(line.trim()); i++;
  }
  flushP(); flushL();
  return out.join('\n');
}

function parseFront(raw){
  const meta={}; let body=raw;
  if(raw.startsWith('---')){
    const end = raw.indexOf('\n---', 3);
    if(end>-1){
      raw.slice(3,end).split('\n').forEach(l => {
        const c = l.indexOf(':'); if(c<0) return;
        const k=l.slice(0,c).trim(); let v=l.slice(c+1).trim();
        meta[k] = (v.startsWith('[')&&v.endsWith(']'))
          ? v.slice(1,-1).split(',').map(x=>x.trim()).filter(Boolean) : v;
      });
      body = raw.slice(end+4).replace(/^\n+/,'');
    }
  }
  return {meta, body};
}

/* ------------------------------------------------------ tracker overlay */
function trackerFor(system){
  if(!TRACKER || !TRACKER.topics) return null;
  const key = system.toLowerCase();
  let tested=0, correct=0, last=null;
  Object.entries(TRACKER.topics).forEach(([k,d]) => {
    if(k.split('—')[0].trim().toLowerCase() !== key) return;
    tested += d.tested||0;
    correct += (d.correct!=null ? d.correct : Math.round((d.score||0)/100*(d.tested||0)));
    if(d.last && (!last || d.last>last)) last=d.last;
  });
  if(!tested) return {tested:0};
  return {tested, correct, score:Math.round(correct/tested*100), last};
}

function daysSince(d){
  if(!d) return null;
  return Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/86400000);
}

function relatedFlags(system, note){
  if(!TRACKER || !Array.isArray(TRACKER.open)) return [];
  const bag = new Set(tokenize([note.title, (note.tags||[]).join(' '),
    (note.headings||[]).map(h=>h.text).join(' ')].join(' ')));
  return TRACKER.open
    .filter(f => (f.s||'').toLowerCase() === system.toLowerCase())
    .map(f => {
      const ft = tokenize(f.t);
      const overlap = ft.filter(t => bag.has(t)).length;
      return {f, rel: overlap / Math.max(3, ft.length)};
    })
    .sort((a,b) => b.rel-a.rel || (b.f.n||0)-(a.f.n||0))
    .slice(0,5);
}

/* --------------------------------------------------------- note render */
function findNote(path){
  for(const s of (IDX.systems||[])){
    const n = s.notes.find(x => x.path===path);
    if(n) return {sys:s.system, note:n};
  }
  return null;
}

async function loadNoteText(path){
  if(noteCache.has(path)) return noteCache.get(path);
  const r = await fetch(NOTES_BASE + path + '?t=' + Date.now());
  if(!r.ok) throw new Error('note not found ('+r.status+')');
  const t = await r.text();
  noteCache.set(path, t);
  try{
    const c = JSON.parse(localStorage.getItem('finals_notes_text_v1')||'{}');
    c[path]=t; localStorage.setItem('finals_notes_text_v1', JSON.stringify(c));
  }catch(e){}
  return t;
}

async function openNote(path, hid){
  const found = findNote(path);
  if(!found){ $('pane').innerHTML='<div class="empty"><h3>Note not found</h3><p>It may have been renamed. Pick another from the list.</p></div>'; return; }
  activePath = path;
  renderTree();
  let raw;
  try{ raw = await loadNoteText(path); }
  catch(err){
    try{ raw = (JSON.parse(localStorage.getItem('finals_notes_text_v1')||'{}'))[path]; }catch(e){}
    if(!raw){ $('pane').innerHTML=`<div class="empty"><h3>Couldn't open that note</h3><p>${esc(err.message)}</p></div>`; return; }
  }
  const {meta, body} = parseFront(raw);
  const sys = found.sys, note = found.note;
  const tk = trackerFor(sys);
  const age = tk && tk.last ? daysSince(tk.last) : null;

  let pills = '';
  if(!tk || !tk.tested){
    pills = `<span class="tpill tp-un">${esc(sys)} · never tested</span>`;
  } else {
    const cls = tk.score<50 ? 'tp-low' : tk.score<75 ? 'tp-bord' : 'tp-in';
    pills = `<span class="tpill ${cls}">${esc(sys)} · ${tk.score}% over ${tk.tested} q</span>` +
      (age!=null ? `<span class="tpill tp-un">tested ${age===0?'today':age+'d ago'}</span>` : '');
  }
  if(QUIZ_MAP[sys.toLowerCase()]) pills += `<a class="tpill tp-un" style="text-decoration:none"
      href="./index.html">${esc(sys)} quiz in the bank →</a>`;

  const rel = relatedFlags(sys, note);
  const relHtml = rel.length ? `<div class="relflags">
      <h4>Open flags in ${esc(sys)}</h4>
      <ul>${rel.map(r => `<li>${esc(r.f.t)}
        <span class="n">· ${esc(r.f.ty||'')}${r.f.n>1?' · missed '+r.f.n+'×':''}</span></li>`).join('')}</ul>
    </div>` : '';

  $('pane').innerHTML = `<article class="note">
    <div class="note-head">
      <h2>${esc(note.title)}</h2>
      <div class="note-meta">
        <span>${esc(sys)}</span>
        <span>${note.words.toLocaleString()} words</span>
        <span>updated ${esc(note.updated)}</span>
        ${(note.sources||[]).length ? `<span>from ${esc((note.sources||[]).join('; '))}</span>` : ''}
      </div>
      ${(note.tags||[]).length ? `<div class="taglist">${note.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="tstrip">${pills}</div>
      ${note.demo ? '<div style="margin-top:12px"><span class="demo">Demo content — replaced on ingest</span></div>':''}
      ${relHtml}
    </div>
    <div class="md">${mdToHtml(body)}</div>
  </article>`;

  if(hid){
    const el = document.getElementById(hid);
    if(el){ el.scrollIntoView({block:'start', behavior:'smooth'}); el.classList.add('flash'); }
  } else {
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(window.matchMedia('(max-width:820px)').matches) $('tree').classList.remove('open');
}

const QUIZ_MAP = {'surgery':'surgery.json','critical care':'critical-care.json'};

function landing(){
  activePath = null; renderTree();
  const sys = IDX.systems||[];
  if(!sys.length){
    $('pane').innerHTML = `<div class="empty"><h3>No notes yet</h3>
      <p>Drop your notes into <code>notes/&lt;system&gt;/&lt;topic&gt;.md</code> and rebuild the index.</p></div>`;
    return;
  }
  const recent = sys.flatMap(s => s.notes.map(n => ({...n, sys:s.system})))
    .sort((a,b) => String(b.updated).localeCompare(String(a.updated))).slice(0,6);
  $('pane').innerHTML = `<div class="rmeta">Start typing to search, or pick a topic</div>` +
    recent.map(n => {
      const tk = trackerFor(n.sys);
      const lab = (!tk||!tk.tested) ? '<span class="tpill tp-un">never tested</span>'
        : `<span class="tpill ${tk.score<50?'tp-low':tk.score<75?'tp-bord':'tp-in'}">${tk.score}% over ${tk.tested} q</span>`;
      return `<div class="rgroup">
        <h3><a href="#/${encodeURI(n.path)}" style="text-decoration:none">${esc(n.title)}</a></h3>
        <div class="rsys">${esc(n.sys)} · ${n.headings.length} sections · ${n.words.toLocaleString()} words</div>
        <div class="tstrip" style="margin-top:11px">${lab}</div>
      </div>`;
    }).join('');
}

/* -------------------------------------------------------------- routing */
function route(){
  const h = decodeURI(location.hash||'');
  if(h.startsWith('#/')){
    const [p, hid] = h.slice(2).split('::');
    openNote(p, hid ? decodeURIComponent(hid) : null);
  } else if(h.startsWith('#q=')){
    $('q').value = decodeURIComponent(h.slice(3)); doSearch();
  } else {
    landing();
  }
}
window.addEventListener('hashchange', route);

let tmr=null;
$('q').addEventListener('input', () => { clearTimeout(tmr); tmr=setTimeout(doSearch, 110); });
$('qClear').addEventListener('click', () => { $('q').value=''; $('q').focus(); doSearch(); });
$('browseTog').addEventListener('click', () => $('tree').classList.toggle('open'));
document.addEventListener('keydown', e => {
  if(e.key==='/' && document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); $('q').select(); }
  if(e.key==='Escape' && document.activeElement===$('q')){ $('q').value=''; doSearch(); $('q').blur(); }
});
window.addEventListener('storage', e => { if(e.key===TRACKER_KEY){ readTracker(); route(); } });

boot();
</script>
